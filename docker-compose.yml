# Local services for development.
#
# This was Postgres, MinIO (plus a bucket-creation job), Mailpit and Redis. The
# site has no database and no object store any more — projects are files and
# images are build-time assets — so the only service left is the mail sink.
#
# `pnpm mail:up` starts it. Nothing else is required to run the site locally.
services:
  # With RESEND_ENABLED=false, src/lib/mail.ts writes here instead of calling
  # Resend, so the contact flow is testable offline and no real mail is sent.
  # The e2e suite reads it back over the web API to tell an accepted submission
  # from one classified as spam — see e2e/mail.ts.
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"] # SMTP + web UI at :8025
