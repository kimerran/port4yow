# Development only. Production uses Railway managed services (SPEC §13):
# Railway PostgreSQL, Railway MinIO, and Resend. Nothing here is deployed.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
    # Required: without it createbucket races MinIO's startup and mc fails with
    # "dial tcp: lookup minio ... server misbehaving". `depends_on: [minio]`
    # alone waits for the container to START, not to be READY.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live"]
      interval: 5s
      retries: 10

  # One-shot: creates the bucket and pins it private. SPEC §9 — "No public
  # bucket policy." `mc anonymous set none` is what enforces that; media is
  # served only through /api/media/[...key] presigned redirects.
  createbucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/portfolio-media &&
      mc anonymous set none local/portfolio-media"

  # With RESEND_ENABLED=false, src/lib/mail.ts writes here instead of calling
  # Resend, so the contact flow is testable offline and no real mail is sent.
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"] # SMTP + web UI at :8025

  # Optional. SPEC §11 — ship the Postgres-backed rate limiter first; the
  # limiter uses Redis transparently only if REDIS_URL is set.
  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]

volumes: { pgdata: {}, miniodata: {} }
