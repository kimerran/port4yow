# AGENT §5 — "CI runs typecheck, lint, unit + integration tests, pnpm audit,
# gitleaks, and a production build. Red CI does not merge."
#
# The integration job is gone: it existed to run the suite against a real
# Postgres and MinIO, and there is neither. Every remaining job needs only Node
# and, for the browser suite, Mailpit.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# A new push to the same branch supersedes the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # A wedged step otherwise runs to GitHub's 6-hour default before failing.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs history to scan commits, not just the tree.
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Audit
        run: pnpm audit --audit-level=moderate

      - name: Build
        run: pnpm build

  # #40 — SPEC §15's 30KB JavaScript ceiling, so it cannot regress silently.
  #
  # The check measures **rendered pages**, not `dist/`: Astro inlines small
  # module scripts and only emits a separate file once they grow, so a dist-only
  # sum reports less as the payload gets bigger. Rendering used to need the
  # database; the pages are prerendered by `pnpm build` now, so the build output
  # is the rendered output and no services are required.
  budget:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate per-run secrets
        run: |
          {
            echo "FORM_SECRET=$(openssl rand -base64 48)"
            echo "IP_HASH_SALT=$(openssl rand -base64 48)"
          } >> "$GITHUB_ENV"

      - name: Build
        run: pnpm build

      - name: JavaScript budget
        run: pnpm budget:js

    env:
      PUBLIC_SITE_URL: http://localhost:4321
      CONTACT_TO_EMAIL: inbox@mh.neri.ph
      SMTP_URL: smtp://localhost:1025
      RESEND_ENABLED: "false"

  # Separate job: a secret in the history must fail the build even if the
  # code checks pass, and it should be legible as its own red X (SPEC §14.8).
  # #39 — the Playwright suite against a real browser and a real build.
  #
  # Its own job so a browser failure reads as a browser failure, and so it runs
  # in parallel with the rest.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Chromium only. The suite asserts computed styles, focus rings and axe
      # results — none of which differ usefully across engines — and pulling
      # three browsers triples the slowest step in CI for no extra signal.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Mailpit only. `e2e/mail.ts` reads it back to tell an accepted contact
      # submission from one classified as spam — SPEC §7 makes both answer 200,
      # so the delivered email is the only discriminator.
      - name: Start Mailpit
        run: docker compose up -d --wait mailpit

      - name: Generate per-run secrets
        run: |
          {
            echo "FORM_SECRET=$(openssl rand -base64 48)"
            echo "IP_HASH_SALT=$(openssl rand -base64 48)"
          } >> "$GITHUB_ENV"

      # The config's `webServer` runs `pnpm build` itself, so a stale `dist/`
      # cannot make a broken change pass.
      - name: End-to-end tests
        run: pnpm test:e2e

      # Traces and screenshots are kept only for failures (`retain-on-failure`),
      # so this uploads nothing on a green run.
      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

    env:
      PUBLIC_SITE_URL: http://localhost:4321
      CONTACT_TO_EMAIL: inbox@mh.neri.ph
      SMTP_URL: smtp://localhost:1025
      RESEND_ENABLED: "false"

  # Separate job: a secret in the history must fail the build even if the
  # code checks pass, and it should be legible as its own red X (SPEC §14.8).
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
