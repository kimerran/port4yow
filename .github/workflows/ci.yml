# AGENT §5 — "CI runs typecheck, lint, unit + integration tests, pnpm audit,
# gitleaks, and a production build. Red CI does not merge."
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# A new push to the same branch supersedes the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # A wedged step otherwise runs to GitHub's 6-hour default before failing.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs history to scan commits, not just the tree.
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Audit
        run: pnpm audit --audit-level=moderate

      - name: Build
        run: pnpm build

  # #38 — the integration suite against a real, disposable Postgres, MinIO and
  # Mailpit. Its own job so a database failure reads as a database failure
  # rather than as "tests are red", and so it runs in parallel with `verify`.
  #
  # `docker compose` rather than `services:` on purpose. The repo already
  # defines this exact stack for development, including the one-shot job that
  # creates the bucket and pins it private (SPEC §9); using it here means CI and
  # a developer's laptop cannot drift, which is the whole point of "the same
  # service container CI uses". `services:` would also have forced a second
  # definition of MinIO — it cannot pass the `server /data` command those images
  # need without an entrypoint override.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # `--wait` blocks until the healthchecks pass. Without it `createbucket`
      # races MinIO's startup, which is the failure the compose file documents.
      # `createbucket` is excluded because it is one-shot: `--wait` treats a
      # container that exits as a failure, even on exit 0.
      - name: Start Postgres, MinIO and Mailpit
        run: docker compose up -d --wait postgres minio mailpit

      - name: Create the media bucket
        run: docker compose up --exit-code-from createbucket createbucket

      # Secrets are generated per run rather than written into this file.
      # Nothing here is a credential that outlives the job, and AGENT §3's ban
      # on hardcoded credentials does not get an exception for CI.
      - name: Generate per-run secrets
        run: |
          {
            echo "SESSION_SECRET=$(openssl rand -base64 48)"
            echo "FORM_SECRET=$(openssl rand -base64 48)"
            echo "IP_HASH_SALT=$(openssl rand -base64 48)"
          } >> "$GITHUB_ENV"

      # A clean schema every run, from the committed migrations — so the suite
      # is testing the migrations too, not a database someone shaped by hand.
      - name: Apply migrations
        run: pnpm exec prisma migrate deploy

      # `:ci` rather than `test:integration` — same run, but it fails on any
      # skipped test. A skip here can only mean a gate went unset or
      # DATABASE_URL is missing, and a green tick over a test that never ran is
      # the exact failure this job was created to end.
      - name: Integration tests
        run: pnpm test:integration:ci

    env:
      # Matches docker-compose.yml. These belong to containers that live for one
      # job and are reachable only from it.
      DATABASE_URL: postgresql://portfolio:portfolio@localhost:5432/portfolio?schema=public
      PUBLIC_SITE_URL: http://localhost:4321
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: portfolio-media
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      CONTACT_TO_EMAIL: inbox@mh.neri.ph
      SMTP_URL: smtp://localhost:1025
      RESEND_ENABLED: "false"

  # Separate job: a secret in the history must fail the build even if the
  # code checks pass, and it should be legible as its own red X (SPEC §14.8).
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
